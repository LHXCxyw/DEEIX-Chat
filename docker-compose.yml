# DEEIX Chat 单文件 Docker 部署
# 运行方式：在项目根目录执行 `docker compose up -d --build`（本地编译镜像）
# 数据持久化到项目根目录的 ./data，布局与旧版一致，可直接接管旧数据目录
name: deeix-chat

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: deeix-chat:local
    container_name: deeix-chat-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 沿用旧版映射：宿主机 3700 -> 容器 8080
      - "3700:8080"
    volumes:
      - ./data/storage:/app/storage
      - ./data/app:/app/data
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deeix-chat

  postgres:
    image: pgvector/pgvector:pg16
    container_name: deeix-chat-postgres
    restart: unless-stopped
    environment:
      # 与旧库保持一致：复用旧 data/postgres 时密码必须相同
      POSTGRES_USER: deeix_chat
      POSTGRES_PASSWORD: deeix_chat_change_me
      POSTGRES_DB: deeix_chat
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - deeix-chat

  redis:
    image: redis:7-bookworm
    container_name: deeix-chat-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "deeix_chat_change_me"]
    environment:
      REDIS_PASSWORD: deeix_chat_change_me
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - deeix-chat

networks:
  deeix-chat:
    name: deeix-chat-network
